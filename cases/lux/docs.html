<head>

<!-- Same three lines every case study opens with: honour the stored theme
     before first paint so there is no flash, and hide the OS cursor when we
     are inside the portfolio's iframe because the parent draws its own. -->
<script>try{if(localStorage.getItem('ori-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}
if(window.self!==window.top){var _s=document.createElement('style');_s.textContent='*{cursor:none!important}';document.head.appendChild(_s);}</script>
<style>

  /* ══ Palette ══════════════════════════════════════════════════════════════
     Ported from the old site, which was dark-only with GitHub's colours baked
     in - 33 hardcoded values across 55 rules. Everything structural now reads
     the site's own tokens, which are already measured for both themes, and
     only the four things tokens.css has no opinion about live here.

     Those four were checked against all three site surfaces in both themes,
     worst case: do 6.20 / 8.22, dont 6.60 / 6.50, code 6.37 / 6.50. The dark
     values are the originals from the old page, which happened to pass. */
  :root{
    --dx-do:#116329;      --dx-do-bg:rgba(17,99,41,.08);
    --dx-dont:#a40e26;    --dx-dont-bg:rgba(164,14,38,.08);
    --dx-code:#0550ae;    --dx-code-bg:rgba(5,80,174,.06);
    --dx-code-bd:rgba(5,80,174,.14);
  }
  [data-theme="dark"]{
    --dx-do:var(--dx-do);      --dx-do-bg:rgba(126,231,135,.10);
    --dx-dont:var(--dx-dont);    --dx-dont-bg:rgba(255,161,152,.10);
    --dx-code:var(--dx-code);    --dx-code-bg:rgba(121,192,255,.08);
    --dx-code-bd:rgba(121,192,255,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--surface-default);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    color: var(--text-primary); }

  /* Clipped rather than display:none - display:none would take it out of the
     accessibility tree, which is the one thing it is here for. */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
  .shell { display: flex; height: 100%; }

  /* ── NAV ── */
  .nav {
    width: 186px; flex-shrink: 0;
    border-right: 1px solid var(--border-subtle);
    overflow-y: auto; padding: 16px 0;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-group { margin-bottom: 4px; }
  .nav-group-label {
    font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-tertiary); padding: 10px 16px 4px;
  }
  .nav-item {
    /* Buttons now, not divs - that is where the keyboard path, the role and
       the focus ring come from. These four lines undo the button chrome so
       the design is unchanged. */
    width: 100%; font: inherit; text-align: left;
    background: none; border: 0; border-left: 2px solid transparent;
    display: flex; align-items: center; gap: 9px;
    padding: 6px 16px; font-size: 12.5px; color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.12s, background 0.12s; user-select: none;
  }
  .nav-item:focus-visible { outline: 2px solid var(--action-primary);
    outline-offset: -2px; }
  .nav-item:hover { color: var(--text-primary); background: var(--state-hover); }
  .nav-item.active {
    color: var(--text-primary); background: var(--action-primary-subtle);
    border-left-color: var(--action-primary);
    font-weight: 500;
  }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.35; flex-shrink: 0; }
  .nav-item.active .nav-dot { opacity: 1; background: var(--action-primary); }

  /* ── DOC PANEL ── */
  .doc {
    flex: 1; overflow-y: auto; padding: 0;
    scrollbar-width: thin; scrollbar-color: var(--border-default) transparent;
  }
  .doc::-webkit-scrollbar { width: 3px; }
  .doc::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

  /* Header band */
  .doc-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
    overflow: hidden;
  }
  .doc-header::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--hue, var(--action-primary-subtle));
    pointer-events: none;
  }
  .doc-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .doc-badge {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px;
    background: var(--badge-bg, var(--action-primary-subtle));
    color: var(--badge-fg, var(--action-primary));
  }
  .doc-breadcrumb { font-size: 11px; color: var(--text-tertiary); }
  /* h1 and h2 now, for the outline. The type is unchanged - these rules
     already set size, weight and colour, and * { margin:0 } is at the top. */
  .doc-title {
    font-size: 21px; font-weight: 700;
    color: var(--text-primary); letter-spacing: -0.025em;
    line-height: 1.2; margin-bottom: 10px;
  }
  .doc-desc {
    font-size: 12.5px; line-height: 1.75;
    color: var(--text-secondary); max-width: 480px;
  }

  /* Body */
  .doc-body { padding: 20px 28px 28px; }

  .doc-section { margin-bottom: 22px; }
  .doc-section-label {
    font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-tertiary); margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 6px;
  }

  /* Anatomy */
  .anatomy-list { display: flex; flex-direction: column; gap: 3px; }
  .anatomy-item {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 12px; color: var(--text-secondary); padding: 6px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .anatomy-item:last-child { border-bottom: none; }
  .anatomy-num {
    font-size: 10px; font-weight: 600; color: var(--text-tertiary);
    background: var(--surface-raised); border: 1px solid var(--border-default);
    width: 18px; height: 18px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .anatomy-name { color: var(--text-primary); font-weight: 500; }
  .anatomy-sep { color: var(--text-tertiary); margin: 0 4px; }

  /* States */
  .states-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .state-chip {
    font-size: 11px; padding: 3px 9px; border-radius: 5px;
    background: var(--surface-raised); border: 1px solid var(--surface-sunken);
    color: var(--text-secondary);
  }

  /* Behavior */
  .behavior-item {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px; line-height: 1.7;
    color: var(--text-secondary); padding: 7px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .behavior-item:last-child { border-bottom: none; }
  .behavior-icon { color: var(--action-primary); flex-shrink: 0; margin-top: 3px; font-size: 8px; opacity: 0.6; }

  /* Tokens */
  .token-list { display: flex; flex-direction: column; gap: 0; }
  .token-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 11.5px;
  }
  .token-row:last-child { border-bottom: none; }
  .token-name {
    font-family: ui-monospace, 'Fira Code', monospace;
    font-size: 10.5px; color: var(--dx-code);
    background: var(--dx-code-bg);
    border: 1px solid var(--dx-code-bd);
    padding: 1px 6px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0;
  }
  .token-desc { color: var(--text-secondary); line-height: 1.5; }
  /* The old rows carried a hand-written description. These carry the real
     alias chain and resolved value instead - less hand-holding, but it is
     the actual data and it cannot go stale against the library. */
  .token-count { font-weight: 500; letter-spacing: 0; text-transform: none;
    color: var(--text-tertiary); margin-left: 8px; }
  .token-chain { display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    min-width: 0; font-family: ui-monospace, 'Fira Code', monospace;
    font-size: 10.5px; color: var(--text-secondary); }
  .token-hop { overflow-wrap: anywhere; }
  .token-arr { color: var(--text-tertiary); flex-shrink: 0; }
  .token-val { color: var(--text-primary); }
  .token-sw { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
    border: 1px solid var(--border-default); display: inline-block; }
  .token-row { align-items: flex-start; }

  /* Section identity. Measured on both site surfaces; the dark values are the
     originals from the old page, which passed there - it was only light that
     had no answer at all. */
  .dx-cat-foundations{--badge-fg:#0664a8}
  .dx-cat-components {--badge-fg:#6248E8}
  .dx-cat-patterns   {--badge-fg:#047857}
  [data-theme="dark"] .dx-cat-foundations{--badge-fg:#60a5fa}
  [data-theme="dark"] .dx-cat-components {--badge-fg:#9d71f8}
  [data-theme="dark"] .dx-cat-patterns   {--badge-fg:#34d399}
  /* One tint rule for all three: derived from the ink, so a new section only
     needs the one value. */
  .doc-badge{--badge-bg:color-mix(in srgb, var(--badge-fg) 12%, transparent)}


  /* Do / Don't grid - interleaved pairs */
  .usage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rule {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 9px 11px; border-radius: 7px;
    font-size: 11.5px; line-height: 1.5;
  }
  .rule.do   { background: var(--dx-do-bg); border: 1px solid var(--dx-do-bg); color: var(--dx-do); }
  .rule.dont { background: var(--dx-dont-bg); border: 1px solid var(--dx-dont-bg); color: var(--dx-dont); }
  .rule-icon { font-size: 10px; flex-shrink: 0; margin-top: 2px; font-weight: 700; }
  .rule.do   .rule-icon { color: var(--dx-do); }
  .rule.dont .rule-icon { color: var(--dx-dont); }

  /* Keyboard */
  .key-table { width: 100%; border-collapse: collapse; }
  .key-table tr { border-bottom: 1px solid var(--border-subtle); }
  .key-table tr:last-child { border-bottom: none; }
  .key-table td { padding: 6px 0; font-size: 11.5px; vertical-align: top; }
  .key-table td:first-child { width: 44%; padding-right: 12px; }
  .kbd {
    display: inline-flex; align-items: center;
    background: var(--surface-raised); border: 1px solid var(--border-default);
    border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 6px; font-size: 10.5px; color: var(--text-secondary);
    font-family: ui-monospace, monospace; white-space: nowrap;
    margin-right: 3px;
  }
  .key-desc { color: var(--text-secondary); }
</style>
</head>

function kbdHtml(keys) {
  return keys.map(k => `<span class="kbd">${k}</span>`).join('');
}

function render(id) {
  const d = DATA[id];
  if (!d) return;
  const cat = CATS[d.section] || CATS.Components;

  /* aria-current moves with .active. Without it the class is a colour change
     only, and a screen reader keeps announcing the first item as current. */
  document.querySelectorAll('.nav-item').forEach(i => {
    i.classList.remove('active');
    i.removeAttribute('aria-current');
  });
  const sel = document.querySelector(`.nav-item[data-id="${id}"]`);
  sel.classList.add('active');
  sel.setAttribute('aria-current', 'page');

  const keyboardSection = d.keyboard.length ? `
    <div class="doc-section">
      <h3 class="doc-section-label">Keyboard</h3>
      <table class="key-table">
        ${d.keyboard.map(([keys, desc]) => `
          <tr>
            <td>${kbdHtml(keys)}</td>
            <td class="key-desc">${desc}</td>
          </tr>`).join('')}
      </table>
    </div>` : '';

  // Interleave do/don't so they appear as pairs: [do, dont] per row
  const maxRules = Math.max(d.do.length, d.dont.length);
  let usageRows = '';
  for (let i = 0; i < maxRules; i++) {
    usageRows += d.do[i]   ? `<div class="rule do"><span class="rule-icon">✓</span><span>${d.do[i]}</span></div>` : '<div></div>';
    usageRows += d.dont[i] ? `<div class="rule dont"><span class="rule-icon">✕</span><span>${d.dont[i]}</span></div>` : '<div></div>';
  }

  document.getElementById('doc').innerHTML = `
    <div class="doc-header" style="--hue:var(--badge-bg);">
      <div class="doc-meta">
        <span class="doc-badge ${cat.cls}">${d.section}</span>
        <span class="doc-breadcrumb">LUX 2.0 / ${d.section} / ${d.title}</span>
      </div>
      <h2 class="doc-title">${d.title}</h2>
      <div class="doc-desc">${d.desc}</div>
    </div>
    <div class="doc-body">

      <div class="doc-section">
        <h3 class="doc-section-label">Anatomy</h3>
        <div class="anatomy-list">
          ${d.anatomy.map(([name, desc], i) => `
            <div class="anatomy-item">
              <span class="anatomy-num">${i + 1}</span>
              <span><span class="anatomy-name">${name}</span><span class="anatomy-sep"> - </span>${desc}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="doc-section">
        <h3 class="doc-section-label">States</h3>
        <div class="states-row">
          ${d.states.map(s => `<span class="state-chip">${s}</span>`).join('')}
        </div>
      </div>

      <div class="doc-section">
        <h3 class="doc-section-label">Behavior</h3>
        ${d.behavior.map(b => `
          <div class="behavior-item">
            <span class="behavior-icon">▸</span>
            <span>${b}</span>
          </div>`).join('')}
      </div>

      ${keyboardSection}

      <div class="doc-section">
        <h3 class="doc-section-label">Design Tokens
          <span class="token-count">${d.tokenTotal} in ${d.tokenGroup}${d.tokenTotal > d.tokens.length ? ' \u00b7 first ' + d.tokens.length + ' shown' : ''}</span>
        </h3>
        <div class="token-list">
          ${d.tokens.map(([name, chain, resolved, type]) => `
            <div class="token-row">
              <span class="token-name">${name}</span>
              <span class="token-chain">${
                (type === 'color'
                  ? `<i class="token-sw" style="background-color:${resolved}"></i>`
                  : '') +
                chain.map(h => `<span class="token-hop">${h}</span>`).join('<span class="token-arr">\u2192</span>') +
                (chain.length ? '<span class="token-arr">\u2192</span>' : '') +
                `<span class="token-val">${resolved}</span>`
              }</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="doc-section">
        <h3 class="doc-section-label">Usage</h3>
        <div class="usage-grid">${usageRows}</div>
      </div>

    </div>`;
  document.getElementById('doc').scrollTop = 0;
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => render(item.dataset.id));
});
render('action-menu');
</script>
</body>
</html>

<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif">
  <rect width="960" height="420" fill="#2C2C2C"/>

  <!-- Cards -->
  <g>
    <rect x="40" y="40" width="220" height="150" rx="12" fill="#333333" stroke="#3D3D3D"/>
    <text x="60" y="76" font-size="14" font-weight="700" fill="#f3f4f5">Card title</text>
    <rect x="60" y="94"  width="180" height="8" rx="4" fill="#464646"/>
    <rect x="60" y="110" width="140" height="8" rx="4" fill="#464646"/>
    <rect x="60" y="136" width="92" height="32" rx="16" fill="#7B61FF"/>
    <text x="106" y="157" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm</text>

    <rect x="280" y="40" width="220" height="150" rx="12" fill="#333333" stroke="#3D3D3D"/>
    <text x="300" y="76" font-size="14" font-weight="700" fill="#f3f4f5">Card title</text>
    <rect x="300" y="94"  width="180" height="8" rx="4" fill="#464646"/>
    <rect x="300" y="110" width="120" height="8" rx="4" fill="#464646"/>
    <rect x="300" y="136" width="92" height="32" rx="16" fill="none" stroke="#B0A0FF" stroke-width="1.5"/>
    <text x="346" y="157" font-size="12" font-weight="600" fill="#B0A0FF" text-anchor="middle">Details</text>
  </g>

  <!-- Tags -->
  <text x="560" y="30" font-size="10" font-weight="800" letter-spacing="1.4" fill="#8d9296">TAGS</text>
  <g font-size="11" font-weight="700">
    <rect x="560" y="40" width="76" height="28" rx="14" fill="rgba(123,97,255,.15)"/>
    <text x="598" y="58" fill="#B0A0FF" text-anchor="middle">Active</text>

    <rect x="646" y="40" width="64" height="28" rx="14" fill="#3D3D3D"/>
    <text x="678" y="58" fill="#d0d3d6" text-anchor="middle">Draft</text>

    <rect x="720" y="40" width="58" height="28" rx="14" fill="rgba(24,160,251,.15)"/>
    <text x="749" y="58" fill="#75B9FC" text-anchor="middle">Beta</text>

    <rect x="788" y="40" width="76" height="28" rx="14" fill="#7B61FF"/>
    <text x="826" y="58" fill="#FFFFFF" text-anchor="middle">Stable</text>

    <rect x="560" y="80" width="54" height="28" rx="14" fill="#18A0FB"/>
    <text x="587" y="98" fill="#FFFFFF" text-anchor="middle">New</text>

    <rect x="624" y="80" width="92" height="28" rx="14" fill="#3D3D3D"/>
    <text x="670" y="98" fill="#d0d3d6" text-anchor="middle">Archived</text>

    <rect x="726" y="80" width="56" height="28" rx="14" fill="rgba(123,97,255,.15)"/>
    <text x="754" y="98" fill="#B0A0FF" text-anchor="middle">Live</text>
  </g>

  <!-- Buttons -->
  <text x="40" y="224" font-size="10" font-weight="800" letter-spacing="1.4" fill="#8d9296">BUTTONS</text>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="234" width="110" height="40" rx="10" fill="#7B61FF"/>
    <text x="95" y="259" fill="#FFFFFF">Primary</text>

    <rect x="166" y="234" width="120" height="40" rx="10" fill="none" stroke="#B0A0FF" stroke-width="1.5"/>
    <text x="226" y="259" fill="#B0A0FF">Secondary</text>

    <rect x="302" y="234" width="90" height="40" rx="10" fill="none"/>
    <text x="347" y="259" fill="#d0d3d6">Ghost</text>

    <rect x="408" y="234" width="110" height="40" rx="10" fill="#3D3D3D"/>
    <text x="463" y="259" fill="#595959">Disabled</text>
  </g>

  <!-- Input + controls -->
  <text x="560" y="224" font-size="10" font-weight="800" letter-spacing="1.4" fill="#8d9296">INPUT</text>
  <text x="560" y="246" font-size="11" fill="#d0d3d6">Label</text>
  <rect x="560" y="254" width="360" height="44" rx="8" fill="#333333" stroke="#464646"/>
  <text x="576" y="281" font-size="13" fill="#8d9296">Placeholder text</text>

  <rect x="560" y="316" width="18" height="18" rx="4" fill="rgba(123,97,255,.15)" stroke="#B0A0FF" stroke-width="1.5"/>
  <path d="M564 325l4 4 8-9" fill="none" stroke="#B0A0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="588" y="330" font-size="12" fill="#d0d3d6">Remember me</text>

  <rect x="760" y="312" width="40" height="22" rx="11" fill="#7B61FF"/>
  <circle cx="789" cy="323" r="9" fill="#FFFFFF"/>

  <text x="40" y="400" font-size="12" fill="#d0d3d6">Dark mode, shipped on day one — a first for Verint.</text>
</svg>
